<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="title desc"><title id="title">Day 010: Reliable dataset processing pipelines</title><desc id="desc">A 16:9 educational diagram illustrating source, split, clean, transform, verify and version stages.</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#071d3c"/><stop offset="1" stop-color="#12606b"/></linearGradient></defs><rect width="960" height="540" fill="url(#g)"/><circle cx="865" cy="70" r="180" fill="#22d3ee" opacity=".12"/><g font-family="Arial,sans-serif"><text x="52" y="80" fill="#79e7e9" font-size="23" font-weight="bold">CODE THERAPIST AI ACADEMY · DAY 010</text><text x="52" y="145" fill="white" font-size="46" font-weight="bold">Reliable Data Pipelines</text><text x="52" y="188" fill="#cde6ef" font-size="23">From documented sources to reproducible transformations</text></g><g font-family="Arial,sans-serif" text-anchor="middle" font-size="19" font-weight="bold"><rect x="43" y="255" width="135" height="105" rx="12" fill="#176d87"/><text x="110" y="305" fill="white">SOURCE</text><text x="110" y="333" font-size="14" fill="#bde5e7">provenance</text><rect x="191" y="255" width="135" height="105" rx="12" fill="#176d87"/><text x="258" y="305" fill="white">SPLIT</text><text x="258" y="333" font-size="14" fill="#bde5e7">prevent leakage</text><rect x="339" y="255" width="135" height="105" rx="12" fill="#176d87"/><text x="406" y="305" fill="white">CLEAN</text><text x="406" y="333" font-size="14" fill="#bde5e7">inspect errors</text><rect x="487" y="255" width="135" height="105" rx="12" fill="#176d87"/><text x="554" y="305" fill="white">MAP</text><text x="554" y="333" font-size="14" fill="#bde5e7">transform</text><rect x="635" y="255" width="135" height="105" rx="12" fill="#176d87"/><text x="702" y="305" fill="white">VERIFY</text><text x="702" y="333" font-size="14" fill="#bde5e7">schema + tests</text><rect x="783" y="255" width="135" height="105" rx="12" fill="#176d87"/><text x="850" y="305" fill="white">VERSION</text><text x="850" y="333" font-size="14" fill="#bde5e7">revision + seed</text></g><g stroke="#fbd38d" stroke-width="4" fill="none"><path d="M178 307h13m135 0h13m135 0h13m135 0h13m135 0h13"/></g><text x="52" y="451" font-family="Arial,sans-serif" font-size="22" fill="#fbd38d">Never silently overwrite the raw source dataset.</text><text x="52" y="490" font-family="Arial,sans-serif" font-size="17" fill="#cde6ef">Original educational illustration · 15 November 2026</text></svg>
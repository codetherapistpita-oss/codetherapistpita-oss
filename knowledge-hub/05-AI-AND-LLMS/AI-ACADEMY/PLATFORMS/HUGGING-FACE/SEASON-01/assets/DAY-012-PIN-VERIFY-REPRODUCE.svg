 d="m747 301 12 10-12 10" stroke="#6ee5e5" stroke-width="4" fill="none"/><rect x="771" y="255" width="145" height="113" rx="14" fill="#166386"/><text x="844" y="303" font-size="23" fill="#fff" font-weight="bold">Record</text><text x="844" y="336" font-size="17" fill="#b9f0ed">audit trail</text></g><text x="55" y="453" fill="#ffdc87" font-size="23" font-family="Arial">“main” can move. A full commit hash identifies a revision.</text><text x="55" y="491" fill="#c9e3f2" font-size="18" font-family="Arial">Original academy artwork · 16:9 SVG · 17 November 2026</text></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc"><title id="title">Day 014 Space authentication and secrets</title><desc id="desc">An educational flow from user sign in through scoped authorization to a protected application, with secrets stored separately.</desc><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#0a1734"/><stop offset="1" stop-color="#174f74"/></linearGradient></defs><rect width="960" height="540" fill="url(#g)"/><circle cx="835" cy="86" r="165" fill="#2bc9cb" opacity=".11"/><g font-family="Arial,sans-serif"><text x="55" y="77" fill="#73e2e6" font-size="22" font-weight="700">CODE THERAPIST · HUGGING FACE · DAY 014</text><text x="55" y="148" fill="#fff" font-size="44" font-weight="700">Authentication &amp; Secrets</text><text x="55" y="193" fill="#cbdfee" font-size="23">Protect access without exposing credentials</text><g font-size="21" font-weight="700" text-anchor="middle"><rect x="55" y="251" width="185" height="112" rx="15" fill="#145d80"/><text x="147" y="295" fill="white">User</text><text x="147" y="326" fill="#b5e9e9" font-size="16">sign-in request</text><rect x="299" y="251" width="186" height="112" rx="15" fill="#145d80"/><text x="392" y="295" fill="white">OAuth / OIDC</text><text x="392" y="326" fill="#b5e9e9" font-size="16">verify identity</text><rect x="545" y="251" width="178" height="112" rx="15" fill="#145d80"/><text x="634" y="295" fill="white">Authorization</text><text x="634" y="326" fill="#b5e9e9" font-size="16">least privilege</text><rect x="780" y="251" width="127" height="112" rx="15" fill="#145d80"/><text x="843" y="295" fill="white">Space</text><text x="843" y="326" fill="#b5e9e9" font-size="16">safe action</text></g><g stroke="#70e2e5" stroke-width="5" fill="none"><path d="M247 307h43m-10 -10 10 10-10 10"/><path d="M492 307h43m-10 -10 10 10-10 10"/><path d="M731 307h39m-10 -10 10 10-10 10"/></g><rect x="304" y="405" width="350" height="62" rx="12" fill="#103c5c" stroke="#f3c66d" stroke-width="2"/><text x="479" y="444" text-anchor="middle" fill="#f9d47c" font-size="21" font-weight="700">Secrets stay server-side</text><text x="55" y="504" fill="#cbdfee" font-size="17">Original 16:9 academy artwork · 19 November 2026</text></g></svg>